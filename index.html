<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  
  <title>Frontend Mentor | Results summary component</title>
  <link rel="stylesheet" href="style.css">
  <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
  <style>
    .attribution { font-size: 11px; text-align: center; }
    .attribution a { color: hsl(228, 45%, 44%); }
  </style>
</head> 
<body>

  <main>
    <section class="col col-1">
      <h3 class="tittle">Your Result</h3>

      <div class="score">
        <p class="result-score">76</p>
        <p class="result-total">of 100</p>
      </div>

      <h3 class="sub-tittle">Great</h3>

      <p class="result-par">You scored higher than 65% of the people who have taken these tests.</p>
    </section>
    
    <section class="col col-2">
      <h3>Summary</h3>
      
      <div class="summary-score">
        <div class="row">
          <div class="icon">
            <img src="assets/images/icon-reaction.svg" alt="reaction icon">
            <b class="reaction">Reaction</b>
          </div>
          <p><b>80</b> / 100</p>
        </div>

        <div class="row">
          <div class="icon">
            <img src="assets/images/icon-memory.svg" alt="memory icon">
            <b class="memory">Memory</b>
          </div>
          <p><b>92</b> / 100</p>
        </div>

        <div class="row">
          <div class="icon">
            <img src="assets/images/icon-verbal.svg" alt="verbal icon">
            <b class="verbal">Verbal</b>
          </div>
          <p><b>61</b> / 100</p>
        </div>

        <div class="row">
          <div class="icon">
            <img src="assets/images/icon-visual.svg" alt="visual icon">
            <b class="visual">Visual</b>
          </div>
          <p><b>72</b> / 100</p>
        </div>


        <button>Continue</button>
      </div>

      
    </section>
  </main>

  
  <!-- <div class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge" target="_blank">Frontend Mentor</a>. 
    Coded by <a href="#">Your Name Here</a>.
  </div> -->
</body>
</html>
